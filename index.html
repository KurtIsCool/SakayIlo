<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakayIlo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#001f3f',
                        sky: {
                            DEFAULT: '#87CEEB',
                            light: '#e0f2fe',
                        },
                        jeepney: {
                            yellow: '#F59E0B', // amber-500
                            red: '#EF4444',    // red-500
                            orange: '#F97316'  // orange-500
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                        'floating': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 0; }
        .leaflet-bottom.leaflet-right { display: none; } /* Hide attribution for cleaner UI demo */

        /* Custom Scrollbar for results */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Input focus rings */
        .input-focus:focus-within {
            ring-2 ring-sky-300 border-sky-400;
        }

        /* Slide Up Animation */
        .slide-up-enter {
            transform: translateY(100%);
        }
        .slide-up-enter-active {
            transform: translateY(0);
            transition: transform 0.3s ease-out;
        }
        .slide-up-exit {
            transform: translateY(100%);
            transition: transform 0.3s ease-in;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-[5000] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative w-24 h-24 mb-4">
            <div class="absolute inset-0 bg-sky-200 rounded-full animate-ping opacity-75"></div>
            <div class="relative w-24 h-24 bg-navy rounded-full flex items-center justify-center shadow-lg overflow-hidden">
                <img src="assets/sakay_logo.jpg" alt="SakayIlo Logo" class="w-full h-full object-cover">
            </div>
        </div>
        <h1 class="text-3xl font-bold text-navy tracking-tight">SakayIlo</h1>
        <p class="text-slate-500 text-sm mt-2 font-medium">Your guide to Iloilo City</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- UI Overlay: Search Card -->
    <div id="search-card" class="absolute top-4 left-4 right-4 z-[1000] bg-white rounded-2xl shadow-floating p-4 flex flex-col gap-3 transition-all duration-300">
        <!-- From Input -->
        <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100 input-focus transition-all">
            <i data-lucide="map-pin" class="text-sky-500 w-5 h-5"></i>
            <input type="text" id="start-location" placeholder="Current Location" class="flex-grow bg-transparent outline-none text-slate-800 placeholder-slate-400 font-medium text-sm">
            <button id="use-gps-btn" class="text-slate-400 hover:text-sky-500 transition-colors">
                <i data-lucide="crosshair" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- To Input -->
        <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100 input-focus transition-all">
            <i data-lucide="flag" class="text-jeepney-red w-5 h-5"></i>
            <input type="text" id="destination" placeholder="Where are you going?" class="flex-grow bg-transparent outline-none text-slate-800 placeholder-slate-400 font-medium text-sm">
        </div>

        <!-- Find Route Button -->
        <button id="find-route-btn" class="w-full bg-navy text-white font-bold py-3 rounded-xl shadow-lg shadow-navy/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            <i data-lucide="search" class="w-5 h-5"></i>
            Find Route
        </button>
    </div>

    <!-- Results Container (Hidden by default) -->
    <div id="results-container" class="absolute bottom-0 left-0 right-0 z-[2000] transform translate-y-full transition-transform duration-300 max-h-[60vh] flex flex-col">
        <!-- Close Button (Floating above sheet) -->
        <div class="absolute -top-12 right-4">
             <button id="close-results-btn" class="bg-white text-slate-700 p-2 rounded-full shadow-lg active:scale-90 transition-transform hidden">
                <i data-lucide="x" class="w-6 h-6"></i>
             </button>
        </div>

        <!-- Sheet Content -->
        <div class="bg-white rounded-t-3xl shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.2)] flex flex-col flex-grow overflow-hidden">
            <!-- Handle -->
            <div class="w-full flex justify-center pt-3 pb-1 cursor-pointer" id="sheet-handle">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
            </div>

            <!-- Header -->
            <div class="px-6 pb-2">
                 <h2 class="text-lg font-bold text-navy" id="results-header">Best Routes</h2>
                 <p class="text-xs text-slate-500" id="results-subtext">Calculating options...</p>
            </div>

            <!-- Scrollable List -->
            <div id="results-list" class="overflow-y-auto p-4 space-y-3 pb-8 hide-scrollbar">
                <!-- Cards will be injected here -->
                <div class="text-center py-8 text-slate-400">
                    <i data-lucide="map" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                    <p>Enter a destination to see routes</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-navy text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium z-[3000] opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.88.0'

        // --- CONFIG ---
        const SUPABASE_URL = 'https://cgxvfhxdiqpmnfpktjvr.supabase.co';
        const ANON_KEY = '<INSERT_SUPABASE_ANON_KEY_HERE>';

        // --- STATE ---
        let userPos = { lat: 10.7202, lng: 122.5621 }; // Default Iloilo City
        let map;
        let layers = {
            user: null,
            dest: null,
            routes: []
        };
        let startLocationName = "Current Location";

        // --- ICONS (SVG Strings) ---
        const svgs = {
            user: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#001f3f" stroke="white" stroke-width="2" class="w-full h-full drop-shadow-md"><circle cx="12" cy="12" r="10"/></svg>`,
            dest: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#EF4444" stroke="white" stroke-width="2" class="w-full h-full drop-shadow-md"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg>`,
            bus: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><path d="M4 11h16"/><path d="M8 15h.01"/><path d="M16 15h.01"/><path d="M6 19v2"/><path d="M18 19v2"/></svg>`, // fallback
            jeep: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2l.64-2.54c.24-.959.24-1.962 0-2.92l-1.07-4.27A2 2 0 0 0 18.63 6H5.37a2 2 0 0 0-1.94 1.27l-1.07 4.27c-.24.959-.24 1.962 0 2.92L3 17h2"/><path d="M14 17H9"/><path d="M4 17v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg>`
        };

        // --- INIT ---
        async function init() {
            lucide.createIcons();

            // Check API Key
            if (ANON_KEY === '<INSERT_SUPABASE_ANON_KEY_HERE>' || !ANON_KEY) {
                showToast('Warning: Supabase Anon Key missing.');
            }
            const supabase = createClient(SUPABASE_URL, ANON_KEY);

            // Init Map
            map = L.map('map', { zoomControl: false }).setView([userPos.lat, userPos.lng], 13);

            // CartoDB Voyager - Clean & Minimal
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap, &copy; CartoDB'
            }).addTo(map);

            // User Marker
            updateUserMarker();

            // Get Real Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    map.setView([userPos.lat, userPos.lng], 15);
                    updateUserMarker();
                    document.getElementById('start-location').placeholder = "Current Location (GPS Found)";
                }, err => {
                    console.error("GPS Error", err);
                    showToast("GPS Access Denied. Using Default.");
                });
            }

            // Bind UI Events
            document.getElementById('find-route-btn').onclick = () => handleSearch(supabase);
            document.getElementById('close-results-btn').onclick = closeResults;
            document.getElementById('destination').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch(supabase);
            });
            document.getElementById('use-gps-btn').onclick = () => {
                document.getElementById('start-location').value = "";
                document.getElementById('start-location').placeholder = "Current Location";
                startLocationName = "Current Location";
                showToast("Using Current Location");
            };

            // Remove splash
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }, 1500);
        }

        function updateUserMarker() {
            if (layers.user) map.removeLayer(layers.user);
            const icon = L.divIcon({
                className: 'bg-transparent',
                html: svgs.user,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            layers.user = L.marker([userPos.lat, userPos.lng], { icon }).addTo(map);
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            const txt = document.getElementById('toast-msg');
            txt.innerText = msg;
            el.classList.remove('opacity-0');
            setTimeout(() => el.classList.add('opacity-0'), 3000);
        }

        async function geocode(query) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Iloilo City, Philippines')}&limit=1`;
            try {
                const res = await fetch(url);
                const json = await res.json();
                if (json && json.length > 0) {
                    return { lat: parseFloat(json[0].lat), lng: parseFloat(json[0].lon), name: json[0].display_name.split(',')[0] };
                }
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        async function handleSearch(supabase) {
            const startInput = document.getElementById('start-location').value;
            const destInput = document.getElementById('destination').value;

            if (!destInput) {
                showToast("Please enter a destination.");
                document.getElementById('destination').focus();
                return;
            }

            const btn = document.getElementById('find-route-btn');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader" class="animate-spin w-5 h-5"></i> Searching...`;
            lucide.createIcons();

            try {
                // 1. Resolve Start
                let startCoords = userPos;
                if (startInput && startInput.trim() !== "") {
                    const s = await geocode(startInput);
                    if (s) {
                        startCoords = s;
                        startLocationName = s.name;
                    } else {
                        showToast("Start location not found.");
                        btn.innerHTML = originalBtnText;
                        return;
                    }
                }

                // 2. Resolve Dest
                const d = await geocode(destInput);
                if (!d) {
                    showToast("Destination not found.");
                    btn.innerHTML = originalBtnText;
                    return;
                }

                // Update Map
                if (layers.dest) map.removeLayer(layers.dest);
                const destIcon = L.divIcon({
                     className: 'bg-transparent',
                     html: svgs.dest,
                     iconSize: [32, 32],
                     iconAnchor: [16, 32]
                });
                layers.dest = L.marker([d.lat, d.lng], { icon: destIcon }).addTo(map);

                map.fitBounds([
                    [startCoords.lat, startCoords.lng],
                    [d.lat, d.lng]
                ], { padding: [50, 150] }); // more bottom padding for sheet

                // 3. Supabase RPC
                const { data, error } = await supabase.rpc('find_best_route', {
                    user_lat: startCoords.lat,
                    user_lng: startCoords.lng,
                    dest_lat: d.lat,
                    dest_lng: d.lng
                });

                if (error) throw error;

                displayResults(data || []);

            } catch (err) {
                console.error(err);
                showToast("Error searching routes.");
            } finally {
                btn.innerHTML = originalBtnText;
                lucide.createIcons(); // refresh icons if needed
            }
        }

        function displayResults(routes) {
            const container = document.getElementById('results-container');
            const list = document.getElementById('results-list');
            const closeBtn = document.getElementById('close-results-btn');

            list.innerHTML = ""; // clear

            if (routes.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-500">No routes found nearby.</div>`;
            } else {
                document.getElementById('results-subtext').innerText = `${routes.length} route(s) found`;

                // For simplicity, we only visualize the first (best) route on map for now
                // Ideally, clicking a card would visualize that specific route
                visualizeRoute(routes[0]);

                routes.forEach((route, index) => {
                    const isBest = index === 0;
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border transition-all cursor-pointer ${isBest ? 'bg-sky-50 border-sky-200 ring-1 ring-sky-100' : 'bg-white border-slate-100 hover:bg-slate-50'}`;

                    const timeEst = Math.round(route.total_walking_distance_meters / 1.4 / 60) + 10; // rough est: walk + wait + ride

                    card.innerHTML = `
                        <div class="flex items-start justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center ${isBest ? 'bg-sky-500 text-white' : 'bg-slate-100 text-slate-500'}">
                                    <i data-lucide="bus" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-navy text-base">${route.route_name}</h3>
                                    <p class="text-xs text-slate-500">${route.formal_name}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="block font-bold text-navy text-lg">~${timeEst} min</span>
                                <span class="text-xs text-slate-400">${(route.total_walking_distance_meters/1000).toFixed(1)} km walk</span>
                            </div>
                        </div>
                        <div class="mt-3 flex items-center gap-2 text-xs font-medium text-slate-600">
                             <span class="bg-white border border-slate-200 px-2 py-1 rounded-md">🚶 Walk</span>
                             <span class="text-slate-300">→</span>
                             <span class="bg-jeepney-yellow/20 text-jeepney-orange border border-jeepney-yellow/30 px-2 py-1 rounded-md">Jeepney</span>
                             <span class="text-slate-300">→</span>
                             <span class="bg-white border border-slate-200 px-2 py-1 rounded-md">Walk</span>
                        </div>
                    `;

                    card.onclick = () => visualizeRoute(route);
                    list.appendChild(card);
                });
            }

            container.classList.remove('translate-y-full');
            closeBtn.classList.remove('hidden');
            lucide.createIcons();
        }

        function visualizeRoute(route) {
             // Clear old layers
             layers.routes.forEach(l => map.removeLayer(l));
             layers.routes = [];

             const segment = JSON.parse(route.route_segment_geojson);
             const pickup = JSON.parse(route.pickup_point_geojson);
             const dropoff = JSON.parse(route.dropoff_point_geojson);

             // Route Line
             const line = L.geoJSON(segment, {
                style: {
                    color: route.color || '#001f3f',
                    weight: 6,
                    opacity: 0.9,
                    lineCap: 'round',
                    lineJoin: 'round'
                }
            }).addTo(map);
            layers.routes.push(line);

            // Points
            const startCircle = L.circleMarker([pickup.coordinates[1], pickup.coordinates[0]], {
                radius: 6, color: 'white', fillColor: '#22c55e', fillOpacity: 1, weight: 2
            }).addTo(map).bindPopup("Board Here");

            const endCircle = L.circleMarker([dropoff.coordinates[1], dropoff.coordinates[0]], {
                radius: 6, color: 'white', fillColor: '#ef4444', fillOpacity: 1, weight: 2
            }).addTo(map).bindPopup("Get Off");

            layers.routes.push(startCircle, endCircle);
        }

        function closeResults() {
             document.getElementById('results-container').classList.add('translate-y-full');
             document.getElementById('close-results-btn').classList.add('hidden');
             // optional: clear map? no, keep it.
        }

        init();
    </script>
</body>
</html>

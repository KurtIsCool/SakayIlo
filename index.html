<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakayIlo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 0; }
        .leaflet-bottom.leaflet-right { display: none; } /* Hide attribution for cleaner UI demo */

        .brand-font { font-family: 'Fredoka', sans-serif; }

        /* Cartoony Shadow & Borders */
        .cartoony-box {
            border: 3px solid #1e293b; /* slate-800 */
            box-shadow: 4px 4px 0px 0px #1e293b;
        }
        .cartoony-btn {
            border: 3px solid #1e293b;
            box-shadow: 3px 3px 0px 0px #1e293b;
            transition: all 0.1s ease-in-out;
        }
        .cartoony-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px #1e293b;
        }

        /* Loading Screen Transition */
        #loading-screen {
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }
        #loading-screen.hidden-fade {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-sky-100 z-[5000] flex flex-col items-center justify-center">
        <div class="w-48 h-48 bg-white rounded-full flex items-center justify-center border-4 border-slate-800 shadow-[6px_6px_0px_0px_rgba(30,41,59,1)] overflow-hidden mb-6 animate-bounce">
            <img src="assets/sakay_logo.jpg" alt="SakayIlo Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="brand-font text-4xl text-slate-800 tracking-wider">SakayIlo</h1>
        <p class="text-slate-600 mt-2 font-bold animate-pulse">Loading Map...</p>
    </div>

    <div id="map"></div>

    <!-- UI Overlay: Search Bar -->
    <div class="absolute top-6 left-4 right-4 z-[1000]">
        <div class="bg-white rounded-2xl p-2 flex items-center cartoony-box">
            <div id="gps-status" class="w-4 h-4 rounded-full bg-gray-400 mr-3 ml-1 border-2 border-slate-700"></div>
            <input type="text" id="destination" placeholder="Where are you going?" class="flex-grow outline-none text-slate-700 font-bold placeholder-gray-400 bg-transparent">
            <!-- Hidden GO button, we use the big FAB now, or keep it as small secondary -->
            <button id="search-btn-small" class="bg-blue-500 text-white font-bold px-3 py-1 rounded-xl border-2 border-slate-800 hover:bg-blue-400 transition ml-2">GO</button>
        </div>
        <div id="status-msg" class="mt-2 text-sm font-bold text-slate-800 bg-yellow-300 p-2 rounded-xl border-2 border-slate-800 hidden text-center shadow-lg"></div>
    </div>

    <!-- Sakay Middle Button (FAB) -->
    <button id="sakay-btn" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[2000] w-24 h-24 bg-white rounded-full cartoony-btn flex items-center justify-center p-0 overflow-hidden group">
        <div class="w-full h-full relative">
            <img src="assets/sakay_logo.jpg" class="w-full h-full object-cover transition transform group-hover:scale-110 duration-300">
            <!-- Overlay text or icon if needed, but logo is self-explanatory -->
        </div>
    </button>

    <!-- Results Sheet -->
    <div id="results-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl border-t-4 border-slate-800 shadow-[0px_-5px_20px_rgba(0,0,0,0.2)] p-6 transform translate-y-full transition-transform duration-300 z-[1000]">
        <div class="w-16 h-2 bg-slate-200 rounded-full mx-auto mb-6 border border-slate-300"></div>
        <h2 class="text-2xl brand-font font-bold mb-4 text-slate-800">Best Ride</h2>
        <div id="route-card" class="bg-sky-50 p-4 rounded-2xl border-2 border-slate-800 relative">
            <div class="absolute -top-3 -right-3 bg-yellow-400 text-xs font-bold px-2 py-1 rounded-lg border-2 border-slate-800 shadow-sm rotate-12">FASTEST</div>
            <div class="flex justify-between items-center mb-2">
                <span id="route-name" class="font-bold text-2xl text-blue-600 brand-font">Loading...</span>
            </div>
            <p id="route-instruction" class="text-slate-600 text-base font-medium mb-3">...</p>
            <div class="flex items-center text-sm font-bold text-slate-500 space-x-2 bg-white px-3 py-1 rounded-lg inline-block border border-slate-200">
                <span id="walk-dist">🚶 ...</span>
            </div>
        </div>
        <button id="close-sheet-btn" class="w-full mt-4 bg-red-400 text-white font-bold py-3 rounded-xl border-2 border-slate-800 shadow-[3px_3px_0px_0px_#1e293b] active:translate-y-1 active:shadow-none transition">Close</button>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.88.0'

        // --- CONFIG ---
        const SUPABASE_URL = 'https://cgxvfhxdiqpmnfpktjvr.supabase.co';
        // SECURITY WARNING: The key provided in the prompt was a Service Role Key.
        // DO NOT EXPOSE IT IN CLIENT-SIDE CODE.
        // Use the "anon" public key here.
        const ANON_KEY = '<INSERT_SUPABASE_ANON_KEY_HERE>';

        if (ANON_KEY === '<INSERT_SUPABASE_ANON_KEY_HERE>' || !ANON_KEY) {
            alert('CRITICAL: Supabase Anon Key is missing! Please update index.html with your valid ANON_KEY.');
        }

        // --- STATE ---
        let userPos = { lat: 10.7202, lng: 122.5621 }; // Default Iloilo City
        let map;
        let userMarker;
        let routeLayer;
        let destMarker;

        // --- INIT ---
        async function init() {
            const supabase = createClient(SUPABASE_URL, ANON_KEY);

            // Init Map
            map = L.map('map', { zoomControl: false }).setView([userPos.lat, userPos.lng], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: 'OpenStreetMap, CartoDB'
            }).addTo(map);

            // User Marker (Custom Cartoony Icon)
            const iconHtml = `
                <div class="relative w-8 h-8">
                    <div class="absolute inset-0 bg-blue-500 rounded-full border-4 border-white shadow-lg z-10 box-border"></div>
                    <div class="absolute inset-0 bg-blue-400 rounded-full animate-ping opacity-75"></div>
                </div>
            `;

            userMarker = L.marker([userPos.lat, userPos.lng], {
                icon: L.divIcon({
                    className: '',
                    html: iconHtml,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                })
            }).addTo(map);

            // Get Real Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    map.setView([userPos.lat, userPos.lng], 15);
                    userMarker.setLatLng([userPos.lat, userPos.lng]);

                    const gpsEl = document.getElementById('gps-status');
                    gpsEl.classList.remove('bg-gray-400');
                    gpsEl.classList.add('bg-green-500', 'animate-pulse', 'border-green-700');
                }, err => {
                    console.error("GPS Error", err);
                    msg("Location denied. Using default center.");
                });
            }

            // Bind Search Buttons
            document.getElementById('search-btn-small').onclick = () => handleSearch(supabase);

            // Bind FAB (The Sakay Button)
            const sakayBtn = document.getElementById('sakay-btn');
            sakayBtn.onclick = () => {
                const query = document.getElementById('destination').value;
                if (query) {
                    // If there's text, search
                    handleSearch(supabase);
                } else {
                    // Else focus input
                    document.getElementById('destination').focus();
                    msg("Where to? Enter a destination.");
                }
            };

            // Bind Close Sheet
            document.getElementById('close-sheet-btn').onclick = () => {
                 document.getElementById('results-sheet').classList.add('translate-y-full');
                 // Also clear route?
                 if (routeLayer) map.removeLayer(routeLayer);
                 if (destMarker) map.removeLayer(destMarker);
                 map.setView([userPos.lat, userPos.lng], 15);
            };

            // Allow Enter key
            document.getElementById('destination').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch(supabase);
            });

            // Simulate loading done
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.classList.add('hidden-fade');
                // Remove from DOM after transition to free memory? Optional.
                setTimeout(() => loader.remove(), 600);
            }, 2000); // 2 seconds splash
        }

        function msg(text) {
            const el = document.getElementById('status-msg');
            el.innerText = text;
            el.classList.remove('hidden');
            // Cartoony pop animation
            el.classList.add('animate-bounce');
            setTimeout(() => el.classList.remove('animate-bounce'), 1000);

            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        async function handleSearch(supabase) {
            const query = document.getElementById('destination').value;
            if (!query) return;

            msg("Looking for location...");

            // 1. Geocode Destination
            const destPos = await geocode(query);
            if (!destPos) {
                msg("Location not found.");
                return;
            }

            // Show Dest Marker
            if (destMarker) map.removeLayer(destMarker);
            destMarker = L.marker([destPos.lat, destPos.lng], {
                icon: L.divIcon({
                    html: '<div class="text-3xl filter drop-shadow-lg">📍</div>',
                    iconSize: [30, 40],
                    iconAnchor: [15, 40]
                })
            }).addTo(map).bindPopup("Destination").openPopup();

            // Fit bounds
            map.fitBounds([
                [userPos.lat, userPos.lng],
                [destPos.lat, destPos.lng]
            ], { padding: [50, 50] });

            msg("Scanning routes...");

            // 2. Call Supabase RPC
            const { data, error } = await supabase.rpc('find_best_route', {
                user_lat: userPos.lat,
                user_lng: userPos.lng,
                dest_lat: destPos.lat,
                dest_lng: destPos.lng
            });

            if (error) {
                console.error(error);
                msg("Error finding routes.");
                return;
            }

            if (!data || data.length === 0) {
                msg("No routes found nearby (400m).");
                return;
            }

            // 3. Render Best Route
            const best = data[0];
            renderRoute(best);
        }

        async function geocode(query) {
            // Using OSM Nominatim
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Iloilo City, Philippines')}&limit=1`;
            try {
                const res = await fetch(url);
                const json = await res.json();
                if (json && json.length > 0) {
                    return { lat: parseFloat(json[0].lat), lng: parseFloat(json[0].lon) };
                }
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        function renderRoute(route) {
            if (routeLayer) map.removeLayer(routeLayer);

            const segment = JSON.parse(route.route_segment_geojson);
            const pickup = JSON.parse(route.pickup_point_geojson);
            const dropoff = JSON.parse(route.dropoff_point_geojson);

            // Custom line style
            routeLayer = L.geoJSON(segment, {
                style: {
                    color: route.color || '#3388ff',
                    weight: 8,
                    opacity: 0.8,
                    lineCap: 'round'
                }
            }).addTo(map);

            // Draw Points
            L.circleMarker([pickup.coordinates[1], pickup.coordinates[0]], {
                color: '#1e293b', fillColor: '#22c55e', fillOpacity: 1, weight: 3, radius: 8
            }).addTo(map).bindPopup("Board Here");

            L.circleMarker([dropoff.coordinates[1], dropoff.coordinates[0]], {
                color: '#1e293b', fillColor: '#ef4444', fillOpacity: 1, weight: 3, radius: 8
            }).addTo(map).bindPopup("Drop Off");

            // Update UI
            document.getElementById('route-name').innerText = route.route_name;
            document.getElementById('route-name').style.color = route.color;
            document.getElementById('route-instruction').innerText = `Take: ${route.formal_name}`;
            document.getElementById('walk-dist').innerText = `🚶 Walk ${Math.round(route.total_walking_distance_meters)}m`;

            // Show Sheet
            document.getElementById('results-sheet').classList.remove('translate-y-full');
        }

        init();
    </script>
</body>
</html>

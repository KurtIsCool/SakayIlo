<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SakayIlo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#001f3f',
                        sky: {
                            DEFAULT: '#87CEEB',
                            light: '#e0f2fe',
                        },
                        jeepney: {
                            yellow: '#F59E0B', // amber-500
                            red: '#EF4444',    // red-500
                            orange: '#F97316'  // orange-500
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                        'floating': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'nav': '0 -4px 20px rgba(0,0,0,0.05)',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; width: 100vw; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 0; }
        .leaflet-bottom.leaflet-right { display: none; } /* Hide attribution for cleaner UI demo */

        /* Custom Scrollbar for results */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Input focus rings */
        .input-focus:focus-within { ring-2 ring-sky-300 border-sky-400; }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Bottom Nav Safe Area */
        .pb-safe-nav { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }

        /* Filter Button Active State */
        .filter-btn-active { @apply bg-sky-100 text-sky-600 border-sky-200 ring-2 ring-sky-100; }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-[5000] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative w-24 h-24 mb-4">
            <div class="absolute inset-0 bg-sky-200 rounded-full animate-ping opacity-75"></div>
            <div class="relative w-24 h-24 bg-navy rounded-full flex items-center justify-center shadow-lg overflow-hidden">
                <img src="assets/sakay_logo.jpg" alt="SakayIlo Logo" class="w-full h-full object-cover">
            </div>
        </div>
        <h1 class="text-3xl font-bold text-navy tracking-tight">SakayIlo</h1>
        <p class="text-slate-500 text-sm mt-2 font-medium">Your guide to Iloilo City</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- HOME TAB: Floating Action Button -->
    <div id="home-view" class="absolute inset-0 pointer-events-none z-[1000] flex flex-col justify-end pb-[100px] px-4">
        <!-- Search Prompt FAB -->
        <button id="home-search-fab" class="pointer-events-auto bg-white w-full max-w-md mx-auto rounded-full shadow-floating p-4 flex items-center gap-3 active:scale-[0.98] transition-all group">
             <div class="w-10 h-10 bg-sky-100 rounded-full flex items-center justify-center text-sky-600 group-hover:bg-sky-500 group-hover:text-white transition-colors">
                 <i data-lucide="search" class="w-5 h-5"></i>
             </div>
             <div class="flex-grow text-left">
                 <span class="block text-navy font-bold text-sm">Where are you going?</span>
                 <span class="block text-slate-400 text-xs">Tap to search routes</span>
             </div>
             <div class="w-8 h-8 flex items-center justify-center text-slate-300">
                 <i data-lucide="arrow-right" class="w-5 h-5"></i>
             </div>
        </button>
    </div>

    <!-- SAKAY TAB: Search Card & Results -->
    <div id="sakay-view" class="absolute inset-0 pointer-events-none z-[1000] hidden flex flex-col">
        <!-- Search Card -->
        <div class="pointer-events-auto bg-white/95 backdrop-blur-sm rounded-b-3xl shadow-card p-5 flex flex-col gap-4 animate-in slide-in-from-top-10 duration-300">
             <h2 class="text-lg font-bold text-navy flex items-center gap-2">
                 <i data-lucide="map" class="w-5 h-5 text-sky-500"></i> Plan Your Trip
             </h2>

             <!-- From Input -->
             <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200 input-focus transition-all">
                 <i data-lucide="map-pin" class="text-sky-500 w-5 h-5"></i>
                 <input type="text" id="start-location" placeholder="Current Location" class="flex-grow bg-transparent outline-none text-slate-800 placeholder-slate-400 font-medium text-sm">
                 <button id="use-gps-btn" class="text-slate-400 hover:text-sky-500 transition-colors">
                     <i data-lucide="crosshair" class="w-5 h-5"></i>
                 </button>
             </div>

             <!-- To Input -->
             <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200 input-focus transition-all">
                 <i data-lucide="flag" class="text-jeepney-red w-5 h-5"></i>
                 <input type="text" id="destination" placeholder="Where are you going?" class="flex-grow bg-transparent outline-none text-slate-800 placeholder-slate-400 font-medium text-sm">
             </div>

             <!-- Optional Options -->
             <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar" id="search-options">
                 <button data-sort="fastest" class="filter-btn flex-none px-4 py-2 rounded-full bg-slate-100 text-xs font-medium text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition-colors border border-transparent hover:border-sky-200 whitespace-nowrap bg-sky-100 text-sky-600 border-sky-200 ring-2 ring-sky-100">
                    Fastest Route
                 </button>
                 <button data-sort="transfers" class="filter-btn flex-none px-4 py-2 rounded-full bg-slate-100 text-xs font-medium text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition-colors border border-transparent hover:border-sky-200 whitespace-nowrap">
                    Least Transfers
                 </button>
                 <button data-sort="cheapest" class="filter-btn flex-none px-4 py-2 rounded-full bg-slate-100 text-xs font-medium text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition-colors border border-transparent hover:border-sky-200 whitespace-nowrap">
                    Cheapest
                 </button>
             </div>

             <!-- Find Route Button -->
             <button id="find-route-btn" class="w-full bg-navy text-white font-bold py-3.5 rounded-xl shadow-lg shadow-navy/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                 <i data-lucide="search" class="w-5 h-5"></i>
                 Sakay Na!
             </button>
        </div>

        <!-- Results Container (Bottom Sheet) -->
        <div id="results-container" class="pointer-events-auto absolute bottom-[80px] left-0 right-0 transform translate-y-[110%] transition-transform duration-300 max-h-[50vh] flex flex-col z-[1001]">
             <!-- Sheet Content -->
             <div class="bg-white rounded-t-3xl shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.2)] flex flex-col flex-grow overflow-hidden h-full">
                 <!-- Handle -->
                 <div class="w-full flex justify-center pt-3 pb-1 cursor-pointer" id="sheet-handle">
                     <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
                 </div>
                 <!-- Header -->
                 <div class="px-6 pb-2 flex justify-between items-center">
                      <div>
                          <h2 class="text-lg font-bold text-navy">Best Routes</h2>
                          <p class="text-xs text-slate-500" id="results-subtext">Calculating...</p>
                      </div>
                      <button id="close-results-btn" class="text-slate-400 hover:text-slate-600">
                          <i data-lucide="x" class="w-5 h-5"></i>
                      </button>
                 </div>
                 <!-- Scrollable List -->
                 <div id="results-list" class="overflow-y-auto p-4 space-y-3 pb-8 hide-scrollbar">
                     <!-- Cards injected here -->
                 </div>
             </div>
        </div>
    </div>

    <!-- JEEPNEY ROUTES TAB: List View -->
    <div id="routes-view" class="absolute inset-0 bg-white z-[1100] pb-[85px] hidden flex flex-col">
        <!-- Header -->
        <div class="bg-white p-5 pb-3 border-b border-slate-100 flex-none z-10">
            <h2 class="text-2xl font-bold text-navy mb-1">Jeepney Routes</h2>
            <p class="text-slate-500 text-sm mb-4">Explore Iloilo City's jeepney network</p>

            <!-- Search/Filter -->
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                <input type="text" id="route-search" placeholder="Search routes or areas..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-10 pr-4 outline-none focus:ring-2 focus:ring-sky-200 transition-all text-sm font-medium text-navy">
            </div>
        </div>

        <!-- List -->
        <div id="routes-list" class="flex-grow overflow-y-auto p-4 space-y-3 hide-scrollbar">
            <!-- Route Items injected here -->
            <div class="animate-pulse space-y-3">
                <div class="h-20 bg-slate-100 rounded-xl"></div>
                <div class="h-20 bg-slate-100 rounded-xl"></div>
                <div class="h-20 bg-slate-100 rounded-xl"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 pb-safe-nav h-[80px] z-[4000] flex justify-around items-center shadow-nav">
        <!-- Home -->
        <button class="nav-btn group flex flex-col items-center gap-1 p-2 w-20" data-target="home">
            <div class="w-10 h-6 flex items-center justify-center rounded-full transition-all group-[.active]:bg-navy/10">
                <i data-lucide="home" class="w-6 h-6 text-slate-400 group-[.active]:text-navy group-[.active]:fill-navy/20 transition-all"></i>
            </div>
            <span class="text-[10px] font-medium text-slate-400 group-[.active]:text-navy transition-all">Home</span>
        </button>

        <!-- Sakay -->
        <button class="nav-btn group flex flex-col items-center gap-1 p-2 w-20" data-target="sakay">
             <div class="w-10 h-6 flex items-center justify-center rounded-full transition-all group-[.active]:bg-sky-100">
                <i data-lucide="map-pin" class="w-6 h-6 text-slate-400 group-[.active]:text-sky-600 group-[.active]:fill-sky-600/20 transition-all"></i>
            </div>
            <span class="text-[10px] font-medium text-slate-400 group-[.active]:text-sky-600 transition-all">Sakay</span>
        </button>

        <!-- Routes -->
        <button class="nav-btn group flex flex-col items-center gap-1 p-2 w-20" data-target="routes">
             <div class="w-10 h-6 flex items-center justify-center rounded-full transition-all group-[.active]:bg-jeepney-yellow/10">
                <i data-lucide="list" class="w-6 h-6 text-slate-400 group-[.active]:text-jeepney-orange transition-all"></i>
            </div>
            <span class="text-[10px] font-medium text-slate-400 group-[.active]:text-jeepney-orange transition-all">Routes</span>
        </button>
    </nav>

    <!-- Toast -->
    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-navy text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium z-[5000] opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.88.0'

        // --- CONFIG ---
        const SUPABASE_URL = 'https://cgxvfhxdiqpmnfpktjvr.supabase.co';
        const ANON_KEY = '<INSERT_SUPABASE_ANON_KEY_HERE>';
        let supabase = null; // Global reference

        // --- STATE ---
        let userPos = { lat: 10.7202, lng: 122.5621 }; // Iloilo City
        let map;
        let layers = {
            user: null,
            dest: null,
            routes: [], // Active search result routes
            allRoutes: [], // Subtle background routes
            selectedRoute: null // Selected from List
        };
        let startLocationName = "Current Location";
        let allRoutesData = []; // Cache for routes list
        let sortMode = 'fastest'; // Default filter

        // --- ICONS ---
        const svgs = {
            user: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#001f3f" stroke="white" stroke-width="2" class="w-full h-full drop-shadow-md"><circle cx="12" cy="12" r="10"/></svg>`,
            dest: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#EF4444" stroke="white" stroke-width="2" class="w-full h-full drop-shadow-md"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg>`
        };

        // --- INIT ---
        async function init() {
            lucide.createIcons();
            supabase = createClient(SUPABASE_URL, ANON_KEY);

            // Init Map
            map = L.map('map', { zoomControl: false }).setView([userPos.lat, userPos.lng], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19, attribution: ''
            }).addTo(map);

            updateUserMarker();
            loadBackgroundRoutes(supabase);

            // GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    updateUserMarker();
                    document.getElementById('start-location').placeholder = "Current Location (GPS Found)";
                }, () => showToast("GPS Access Denied"));
            }

            // --- Event Listeners ---

            // Tab Switching
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.onclick = () => switchTab(btn.dataset.target, supabase);
            });

            // Home FAB
            document.getElementById('home-search-fab').onclick = () => switchTab('sakay', supabase);

            // Sakay Logic
            document.getElementById('find-route-btn').onclick = () => handleSearch(supabase);
            document.getElementById('close-results-btn').onclick = () => {
                 document.getElementById('results-container').classList.remove('translate-y-0');
                 document.getElementById('results-container').classList.add('translate-y-[110%]');
            };
            document.getElementById('use-gps-btn').onclick = () => {
                document.getElementById('start-location').value = "";
                document.getElementById('start-location').placeholder = "Current Location";
                startLocationName = "Current Location";
                showToast("Using Current Location");
            };

            // Filter Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => {
                    // Update UI
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-sky-100', 'text-sky-600', 'border-sky-200', 'ring-2', 'ring-sky-100');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    });
                    btn.classList.remove('bg-slate-100', 'text-slate-600');
                    btn.classList.add('bg-sky-100', 'text-sky-600', 'border-sky-200', 'ring-2', 'ring-sky-100');

                    sortMode = btn.dataset.sort;
                    // Auto-search if destination exists
                    if (document.getElementById('destination').value) {
                         handleSearch(supabase);
                    }
                }
            });

            // Routes Logic
            document.getElementById('route-search').addEventListener('input', (e) => filterRoutes(e.target.value));

            // Set default tab
            switchTab('home', supabase);

            // Remove splash
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }, 1000);
        }

        // --- TAB MANAGEMENT ---
        function switchTab(tabName, supabase) {
            // Update Nav UI
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.target === tabName) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Update Views
            const homeView = document.getElementById('home-view');
            const sakayView = document.getElementById('sakay-view');
            const routesView = document.getElementById('routes-view');

            // Reset States
            homeView.classList.add('hidden');
            sakayView.classList.add('hidden');
            routesView.classList.add('hidden');

            if (tabName === 'home') {
                homeView.classList.remove('hidden');
                setTimeout(() => map.invalidateSize(), 100);
            } else if (tabName === 'sakay') {
                sakayView.classList.remove('hidden');
                setTimeout(() => map.invalidateSize(), 100);
            } else if (tabName === 'routes') {
                routesView.classList.remove('hidden');
                fetchRoutesList(supabase);
            }
        }

        // --- MAP UTILS ---
        function updateUserMarker() {
            if (layers.user) map.removeLayer(layers.user);
            const icon = L.divIcon({ className: 'bg-transparent', html: svgs.user, iconSize: [24, 24], iconAnchor: [12, 12] });
            layers.user = L.marker([userPos.lat, userPos.lng], { icon }).addTo(map);
        }

        // --- HOME TAB LOGIC ---
        async function loadBackgroundRoutes(supabase) {
            try {
                // Fetch simplified geometries for background
                const { data, error } = await supabase.rpc('get_all_routes_paths');

                if (error) {
                    console.warn("Background routes fetch failed (RPC might not exist yet)", error);
                    return;
                }

                if (data && data.length > 0) {
                    data.forEach(r => {
                        try {
                             const geo = JSON.parse(r.path_geojson);
                             const line = L.geoJSON(geo, {
                                 style: { color: r.color || '#94a3b8', weight: 2, opacity: 0.3 }
                             }).addTo(map);
                             layers.allRoutes.push(line);
                        } catch(e) { console.error("Bad GeoJSON", e); }
                    });
                }
            } catch (err) { console.error(err); }
        }

        // --- ROUTES TAB LOGIC ---
        async function fetchRoutesList(supabase) {
            const listContainer = document.getElementById('routes-list');

            if (allRoutesData.length > 0) {
                renderRoutesList(allRoutesData); // Use global supabase
                return;
            }

            const { data, error } = await supabase
                .from('routes')
                .select('id, route_name, formal_name, color')
                .eq('is_active', true)
                .order('route_name');

            if (error) {
                console.error(error);
                listContainer.innerHTML = `<div class="text-center text-red-500 py-4">Failed to load routes</div>`;
                return;
            }

            allRoutesData = data;
            renderRoutesList(data);
        }

        function renderRoutesList(routes) {
            const listContainer = document.getElementById('routes-list');
            listContainer.innerHTML = "";

            if (routes.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-slate-400 py-8">No routes found</div>`;
                return;
            }

            routes.forEach(route => {
                const el = document.createElement('div');
                el.className = "bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4 hover:border-sky-200 transition-all cursor-pointer";
                el.innerHTML = `
                    <div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm" style="background-color: ${route.color || '#001f3f'}">
                        ${route.route_name.substring(0, 2).toUpperCase()}
                    </div>
                    <div class="flex-grow">
                        <h3 class="font-bold text-navy">${route.route_name}</h3>
                        <p class="text-xs text-slate-500 line-clamp-1">${route.formal_name || 'Jeepney Route'}</p>
                    </div>
                    <div class="text-slate-300">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </div>
                `;
                el.onclick = () => selectRouteFromList(route); // Use global supabase
                listContainer.appendChild(el);
            });
            lucide.createIcons();
        }

        function filterRoutes(query) {
            const q = query.toLowerCase();
            const filtered = allRoutesData.filter(r =>
                r.route_name.toLowerCase().includes(q) ||
                (r.formal_name && r.formal_name.toLowerCase().includes(q))
            );
            renderRoutesList(filtered);
        }

        async function selectRouteFromList(route) {
            if (!supabase) return; // safety
            showToast(`Loading ${route.route_name}...`);

            try {
                // Fetch full geometry using RPC
                const { data, error } = await supabase.rpc('get_route_path', { route_id: route.id });

                if (error) throw error;
                if (!data || data.length === 0) throw new Error("No path data");

                const routeData = data[0];
                const geo = JSON.parse(routeData.path_geojson);

                // Clear existing
                if (layers.selectedRoute) map.removeLayer(layers.selectedRoute);

                // Add new layer
                layers.selectedRoute = L.geoJSON(geo, {
                    style: { color: route.color || '#001f3f', weight: 5, opacity: 1 }
                }).addTo(map);

                // Fit bounds
                map.fitBounds(layers.selectedRoute.getBounds(), { padding: [50, 50] });

                // Switch to map view (Home)
                switchTab('home', supabase);
                showToast(`Showing ${route.route_name}`);

            } catch (e) {
                console.error(e);
                showToast("Could not load route path.");
            }
        }

        // --- SAKAY LOGIC (Search) ---
        async function geocode(query) {
            if (!query) return null;
            const cleanQuery = query.replace(/[^\w\s]/gi, '').trim(); // Basic sanitization
            if (cleanQuery.length < 3) return null;

            // Retries logic
            for (let i = 0; i < 2; i++) {
                try {
                     const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cleanQuery + ', Iloilo City, Philippines')}&limit=1`;
                     const res = await fetch(url, { signal: AbortSignal.timeout(5000) }); // 5s Timeout
                     if (!res.ok) throw new Error("Network Error");

                     const json = await res.json();
                     if (json && json.length > 0) {
                         return {
                             lat: parseFloat(json[0].lat),
                             lng: parseFloat(json[0].lon),
                             name: json[0].display_name.split(',')[0]
                         };
                     }
                     break; // No results, don't retry
                } catch (e) {
                     console.warn(`Geocode attempt ${i+1} failed:`, e);
                     await new Promise(r => setTimeout(r, 1000)); // Wait 1s
                }
            }
            return null;
        }

        async function handleSearch(supabase) {
            const startInput = document.getElementById('start-location').value;
            const destInput = document.getElementById('destination').value;
            const btn = document.getElementById('find-route-btn');

            if (!destInput) return showToast("Please enter a destination.");

            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader" class="animate-spin w-5 h-5"></i> Searching...`;
            lucide.createIcons();

            try {
                let startCoords = userPos;
                if (startInput && startInput.trim() !== "") {
                    // Check if input is "Current Location"
                    if (startInput.toLowerCase().includes("current location")) {
                         // Keep userPos
                    } else {
                        const s = await geocode(startInput);
                        if (s) startCoords = s;
                        else {
                            showToast("Start location not found. Try a landmark.");
                            btn.innerHTML = originalText;
                            return;
                        }
                    }
                }

                const d = await geocode(destInput);
                if (!d) {
                    showToast("Destination not found. Try a landmark.");
                    btn.innerHTML = originalText;
                    return;
                }

                // Map Update
                if (layers.dest) map.removeLayer(layers.dest);
                const destIcon = L.divIcon({ className: 'bg-transparent', html: svgs.dest, iconSize: [32, 32], iconAnchor: [16, 32] });
                layers.dest = L.marker([d.lat, d.lng], { icon: destIcon }).addTo(map);

                // Supabase RPC
                const { data, error } = await supabase.rpc('find_best_route', {
                    user_lat: startCoords.lat,
                    user_lng: startCoords.lng,
                    dest_lat: d.lat,
                    dest_lng: d.lng,
                    sort_mode: sortMode // Pass current filter
                });

                if (error) throw error;
                displayResults(data || []);
                map.fitBounds([[startCoords.lat, startCoords.lng], [d.lat, d.lng]], { padding: [50, 50] });

            } catch (err) {
                console.error(err);
                showToast("Error finding routes. Please try again.");
            } finally {
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        }

        function displayResults(routes) {
            const container = document.getElementById('results-container');
            const list = document.getElementById('results-list');
            list.innerHTML = "";

            if (routes.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-8 text-slate-500 flex flex-col items-center gap-2">
                        <i data-lucide="footprints" class="w-8 h-8 opacity-50"></i>
                        <p>No direct routes found.</p>
                        <p class="text-xs">Try searching for a closer landmark or walking.</p>
                    </div>`;
                lucide.createIcons();
            } else {
                document.getElementById('results-subtext').innerText = `${routes.length} options found`;
                visualizeRoute(routes[0]); // Auto show best

                routes.forEach((route, idx) => {
                    const isBest = idx === 0;
                    const time = Math.round(route.total_walking_distance_meters / 1.4 / 60) + 10; // Approx

                    // Label based on sort
                    let tag = "";
                    if (isBest && sortMode === 'fastest') tag = '<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">FASTEST</span>';
                    else if (route.is_loop_ride) tag = '<span class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">LOOP</span>';

                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border transition-all cursor-pointer ${isBest ? 'bg-sky-50 border-sky-200 ring-1 ring-sky-100' : 'bg-white border-slate-100 hover:bg-slate-50'}`;
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shadow-sm" style="background-color: ${route.color || '#001f3f'}">
                                    ${route.route_name.substring(0,2).toUpperCase()}
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-bold text-navy">${route.route_name}</h3>
                                        ${tag}
                                    </div>
                                    <p class="text-xs text-slate-500">${(route.total_walking_distance_meters/1000).toFixed(1)} km walk</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="block font-bold text-navy text-lg">~${time} min</span>
                            </div>
                        </div>
                    `;
                    card.onclick = () => visualizeRoute(route);
                    list.appendChild(card);
                });
            }
            container.classList.remove('translate-y-[110%]');
            container.classList.add('translate-y-0');
        }

        function visualizeRoute(route) {
             layers.routes.forEach(l => map.removeLayer(l));
             layers.routes = [];

             const segment = JSON.parse(route.route_segment_geojson);
             const line = L.geoJSON(segment, { style: { color: route.color || '#001f3f', weight: 6, opacity: 0.8 } }).addTo(map);
             layers.routes.push(line);

             // Points... (omitted for brevity, can re-add if needed or use existing logic)
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            el.classList.remove('opacity-0');
            setTimeout(() => el.classList.add('opacity-0'), 3000);
        }

        init();
    </script>
</body>
</html>

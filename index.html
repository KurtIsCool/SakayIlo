<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakayIlo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 0; }
        .leaflet-bottom.leaflet-right { display: none; } /* Hide attribution for cleaner UI demo */
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- UI Overlay -->
    <div class="absolute top-4 left-4 right-4 z-[1000]">
        <div class="bg-white rounded-lg shadow-lg p-3 flex items-center">
            <div id="gps-status" class="w-3 h-3 rounded-full bg-gray-400 mr-3"></div>
            <input type="text" id="destination" placeholder="Where are you going?" class="flex-grow outline-none text-gray-700">
            <button id="search-btn" class="text-blue-600 font-bold px-2">GO</button>
        </div>
        <div id="status-msg" class="mt-2 text-xs text-gray-800 bg-white/90 p-1 rounded hidden"></div>
    </div>

    <!-- Results Sheet -->
    <div id="results-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-2xl p-5 transform translate-y-full transition-transform duration-300 z-[1000]">
        <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-4"></div>
        <h2 class="text-lg font-bold mb-2">Best Ride</h2>
        <div id="route-card" class="bg-gray-50 p-4 rounded-xl border border-gray-100">
            <div class="flex justify-between items-center mb-2">
                <span id="route-name" class="font-bold text-lg text-purple-700">Loading...</span>
            </div>
            <p id="route-instruction" class="text-gray-600 text-sm mb-2">...</p>
            <div class="flex items-center text-xs text-gray-500 space-x-4">
                <span id="walk-dist">🚶 ...</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

        // --- CONFIG ---
        const SUPABASE_URL = 'https://cgxvfhxdiqpmnfpktjvr.supabase.co';
        // SECURITY WARNING: The key provided in the prompt was a Service Role Key.
        // DO NOT EXPOSE IT IN CLIENT-SIDE CODE.
        // Use the "anon" public key here.
        const ANON_KEY = '<INSERT_SUPABASE_ANON_KEY_HERE>';

        // --- STATE ---
        let userPos = { lat: 10.7202, lng: 122.5621 }; // Default Iloilo City
        let map;
        let userMarker;
        let routeLayer;

        // --- INIT ---
        async function init() {
            const supabase = createClient(SUPABASE_URL, ANON_KEY);

            // Init Map
            map = L.map('map').setView([userPos.lat, userPos.lng], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            // User Marker
            userMarker = L.marker([userPos.lat, userPos.lng], {
                icon: L.divIcon({
                    className: 'bg-blue-500 w-4 h-4 rounded-full border-2 border-white shadow-lg',
                    iconSize: [16, 16]
                })
            }).addTo(map);

            // Get Real Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    map.setView([userPos.lat, userPos.lng], 15);
                    userMarker.setLatLng([userPos.lat, userPos.lng]);
                    document.getElementById('gps-status').classList.remove('bg-gray-400');
                    document.getElementById('gps-status').classList.add('bg-blue-500', 'animate-pulse');
                }, err => {
                    console.error("GPS Error", err);
                    msg("Location denied. Using default center.");
                });
            }

            // Bind Search
            document.getElementById('search-btn').onclick = () => handleSearch(supabase);
        }

        function msg(text) {
            const el = document.getElementById('status-msg');
            el.innerText = text;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        async function handleSearch(supabase) {
            const query = document.getElementById('destination').value;
            if (!query) return;

            msg("Looking for location...");

            // 1. Geocode Destination (Mocking with a fixed offset for demo, or using Nominatim)
            // Ideally use Nominatim for real results
            const destPos = await geocode(query);
            if (!destPos) {
                msg("Location not found.");
                return;
            }

            // Show Dest Marker
            L.marker([destPos.lat, destPos.lng]).addTo(map).bindPopup("Destination").openPopup();

            // Fit bounds
            map.fitBounds([
                [userPos.lat, userPos.lng],
                [destPos.lat, destPos.lng]
            ], { padding: [50, 50] });

            msg("Scanning routes...");

            // 2. Call Supabase RPC
            const { data, error } = await supabase.rpc('find_best_route', {
                user_lat: userPos.lat,
                user_lng: userPos.lng,
                dest_lat: destPos.lat,
                dest_lng: destPos.lng
            });

            if (error) {
                console.error(error);
                msg("Error finding routes.");
                return;
            }

            if (!data || data.length === 0) {
                msg("No routes found nearby (400m).");
                return;
            }

            // 3. Render Best Route
            const best = data[0];
            renderRoute(best);
        }

        async function geocode(query) {
            // Using OSM Nominatim
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Iloilo City, Philippines')}&limit=1`;
            try {
                const res = await fetch(url);
                const json = await res.json();
                if (json && json.length > 0) {
                    return { lat: parseFloat(json[0].lat), lng: parseFloat(json[0].lon) };
                }
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        function renderRoute(route) {
            if (routeLayer) map.removeLayer(routeLayer);

            const segment = JSON.parse(route.route_segment_geojson);
            const pickup = JSON.parse(route.pickup_point_geojson);
            const dropoff = JSON.parse(route.dropoff_point_geojson);

            // Draw Line
            routeLayer = L.geoJSON(segment, {
                style: { color: route.color || '#3388ff', weight: 5 }
            }).addTo(map);

            // Draw Points
            L.circleMarker([pickup.coordinates[1], pickup.coordinates[0]], { color: 'green', radius: 6 }).addTo(map).bindPopup("Board Here");
            L.circleMarker([dropoff.coordinates[1], dropoff.coordinates[0]], { color: 'red', radius: 6 }).addTo(map).bindPopup("Drop Off");

            // Update UI
            document.getElementById('route-name').innerText = route.route_name;
            document.getElementById('route-name').style.color = route.color;
            document.getElementById('route-instruction').innerText = `Formal: ${route.formal_name}`;
            document.getElementById('walk-dist').innerText = `🚶 Walk ${Math.round(route.total_walking_distance_meters)}m total`;

            // Show Sheet
            document.getElementById('results-sheet').classList.remove('translate-y-full');
        }

        init();
    </script>
</body>
</html>
